name: Build and Release Plugin

on:
  push:
    branches: [ private-release ]
    tags: [ 'v*', 'beta*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_STUDIO_VERSION: 2025.1.1.14
      ANDROID_STUDIO_DIR: ${{ github.workspace }}/.android-studio

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Android Studio
      id: cache_android_studio
      uses: actions/cache@v4
      with:
        path: ${{ env.ANDROID_STUDIO_DIR }}
        key: ${{ runner.os }}-android-studio-${{ env.ANDROID_STUDIO_VERSION }}

    - name: Install Android Studio
      if: steps.cache_android_studio.outputs.cache-hit != 'true'
      run: |
        ARCHIVE="android-studio-${ANDROID_STUDIO_VERSION}-linux.tar.gz"
        DOWNLOAD_URL="https://redirector.gvt1.com/edgedl/android/studio/ide-zips/${ANDROID_STUDIO_VERSION}/${ARCHIVE}"

        mkdir -p "${ANDROID_STUDIO_DIR}"
        curl -fL "${DOWNLOAD_URL}" -o "/tmp/${ARCHIVE}" --retry 3 --retry-all-errors --retry-delay 10
        tar -xzf "/tmp/${ARCHIVE}" -C "${ANDROID_STUDIO_DIR}" --strip-components=1

    - name: Build plugin
      run: cd CodeLocatorPlugin && ../gradlew buildPlugin -x instrumentCode -PlocalIdeOverride="${ANDROID_STUDIO_DIR}" -PuseSourceCode=true -PskipPrivateNexus=true

    - name: Get plugin version
      id: plugin_version
      working-directory: CodeLocatorPlugin
      run: |
        VERSION=$(grep "def myVersion" build.gradle | sed "s/.*'\(.*\)'.*/\1/")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Plugin version: $VERSION"

    - name: Resolve release channel
      id: release_channel
      run: |
        CHANNEL="stable"
        PRERELEASE="false"

        if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == *"beta"* ]]; then
          CHANNEL="beta"
          PRERELEASE="true"
        fi

        echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
        echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
        echo "Release channel: ${CHANNEL}"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: plugin-build-${{ steps.plugin_version.outputs.version }}-${{ steps.release_channel.outputs.channel }}
        path: CodeLocatorPlugin/build/distributions/*.zip

    - name: Upload to Private Plugin Registry
      if: startsWith(github.ref, 'refs/tags/')
      env:
        REGISTRY_URL: ${{ secrets.PLUGIN_REGISTRY_URL }}
        REGISTRY_TOKEN: ${{ secrets.PLUGIN_REGISTRY_TOKEN }}
        VERSION: ${{ steps.plugin_version.outputs.version }}
        CHANNEL: ${{ steps.release_channel.outputs.channel }}
      run: |
        ZIP_FILE="CodeLocatorPlugin/build/distributions/CodeLocatorPlugin-${VERSION}.zip"

        if [ ! -f "$ZIP_FILE" ]; then
          echo "Error: ZIP file not found: $ZIP_FILE"
          exit 1
        fi

        echo "Uploading plugin ${VERSION} to private registry channel ${CHANNEL}..."
        RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST \
          "${REGISTRY_URL}/api/plugins?channel=${CHANNEL}&force=true" \
          -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
          -F "file=@${ZIP_FILE}" \
          --max-time 600 --retry 3 --retry-all-errors)

        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        BODY=$(echo "$RESPONSE" | sed '$d')

        echo "HTTP Status: $HTTP_CODE"
        echo "Response: $BODY"

        if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
          echo "Error: Upload failed with status $HTTP_CODE"
          exit 1
        fi

        echo "Successfully uploaded plugin ${VERSION} to private registry channel ${CHANNEL}"

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: CodeLocator Plugin ${{ github.ref_name }}
        body: |
          ## CodeLocator Plugin Release

          ### Version: ${{ steps.plugin_version.outputs.version }}
          ### Channel: ${{ steps.release_channel.outputs.channel }}

          **Changes in this release:**
          - Auto-built from commit: ${{ github.sha }}

          **Installation:**
          1. Download the CodeLocatorPlugin-${{ steps.plugin_version.outputs.version }}.zip file
          2. In IntelliJ IDEA/Android Studio, go to Settings > Plugins
          3. Click the gear icon and select "Install Plugin from Disk..."
          4. Select the downloaded zip file
          5. Restart the IDE

          **Requirements:**
          - IntelliJ IDEA 2023.2+ or Android Studio
          - Java 17+
        files: |
          CodeLocatorPlugin/build/distributions/*.zip
        draft: false
        prerelease: ${{ steps.release_channel.outputs.prerelease }}
